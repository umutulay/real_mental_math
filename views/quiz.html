<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mental Math — Practice</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="shell quiz-shell"><a class="brand" href="/">∑ mental<span>math</span></a><header class="compact"><small id="session-label">YOUR PRACTICE SESSION</small><h1>Find your flow.</h1><p>One question at a time. You’ve got this.</p></header><section class="card"><div class="stats"><div><small>CORRECT</small><strong id="score">0</strong></div><div><small>BEST STREAK</small><strong id="streak">0</strong></div><div><small>TIME</small><strong id="timer"></strong></div></div><progress id="time-progress" max="100" value="100" aria-label="Time remaining"></progress><p id="question"></p><form id="answer-form"><label for="answer">Your answer</label><div class="answer-row"><input type="number" step="1" id="answer" placeholder="Type your answer" required autocomplete="off"><button type="submit" id="submit-answer">Submit ↵</button></div></form><p id="feedback" role="status" aria-live="polite"></p><p class="hint">Correct answers advance automatically. Press Enter to check another answer.</p></section><div class="quiz-actions"><a href="/">← Change settings</a><button class="secondary" id="end-quiz">Finish session</button></div></main><script type="module" src="/js/quiz.mjs"></script></body></html>
